name: Prepare desktop build
description: Install dependencies for the Windows and Linux clients
runs:
  using: composite
  steps:
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev patchelf squashfs-tools libfuse2
    - uses: actions/setup-node@49933eacc0c908c4d92aeb9bb9bb1b23b8efbfcc # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: app/package-lock.json
    - uses: actions/setup-python@a26af69614d60932df82f8ad61db8a0fdf413c86 # v5
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@e9d7b9fe72fe57eb45fb88c66e302c5c8f99c9fb # v2
      with:
        workspaces: app/src-tauri
        prefix-key: ${{ runner.os }}-akko-studio
    - shell: bash
      working-directory: app
      run: npm ci

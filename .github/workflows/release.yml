name: Publish clients
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-open-akko
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  version:
    needs: checks
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960e07136c2c3e9f2fff67c0a6854cd5113f # v4
      - uses: actions/setup-python@a26af69614d60932df82f8ad61db8a0fdf413c86 # v5
        with:
          python-version: '3.12'
      - id: version
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python tools/release.py version --run-number "$RELEASE_RUN_NUMBER" --repository "$RELEASE_REPOSITORY" --github-output "$GITHUB_OUTPUT"
  build:
    needs: version
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            bundle: appimage
          - os: windows-latest
            platform: windows
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960e07136c2c3e9f2fff67c0a6854cd5113f # v4
      - uses: ./.github/actions/setup-desktop
      - name: Prepare release version and signed bundle
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python tools/release.py prepare --version "$env:RELEASE_VERSION" --platform "$env:RELEASE_PLATFORM"
        if: runner.os == 'Windows'
      - name: Prepare Linux release
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python tools/release.py prepare --version "$RELEASE_VERSION" --platform linux
      - name: Signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Configure the TAURI_SIGNING_PRIVATE_KEY Actions secret before publishing." >&2
            exit 1
          fi
      - name: Build signed release
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          RELEASE_BUNDLE: ${{ matrix.bundle }}
        shell: bash
        run: npx tauri build --ci --config ../.release/tauri-release.json --bundles "$RELEASE_BUNDLE" -- --locked
      - name: Apply AppImage compatibility fixes and re-sign
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: python tools/fix_appimage.py
      - name: Collect signed artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python tools/release.py collect --version "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM"
      - uses: actions/upload-artifact@ea165f80e37c1a1c1c4ed87c70eeacf91da9c3c8 # v4
        with:
          name: signed-${{ matrix.platform }}
          path: artifacts/release/*
          if-no-files-found: error
  publish:
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960e07136c2c3e9f2fff67c0a6854cd5113f # v4
      - uses: actions/setup-python@a26af69614d60932df82f8ad61db8a0fdf413c86 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9fe72fe57eb45fb88c66e302c5c8f99c9fb # v2
        with:
          workspaces: tools/verify-release
      - uses: actions/download-artifact@d3f86a1c09fbd489721e50a78cc87f6c6bd0fa51 # v4
        with:
          pattern: signed-*
          merge-multiple: true
          path: artifacts/release
      - name: Attach exact source commit
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: git archive --format=zip --prefix=open-akko/ -o "artifacts/release/open-akko-${RELEASE_VERSION}-sources.zip" HEAD
      - name: Verify complete feed and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python tools/release.py manifest --version "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY"
          python tools/release.py publish --version "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_SHA"

name: Client checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      - name: Release tooling and model profiles
        run: |
          python tools/check_studio_profiles.py
          python -m unittest discover -s tools -p "test_release.py"
          python tools/release.py validate
      - name: Frontend checks
        working-directory: app
        run: |
          npm run build
          npx vitest run
      - name: Native checks
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
      - name: Layouts and notices
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tools/lint_layouts.py
          cd app
          npx vite build --sourcemap
          python3 ../tools/notices.py --check
